# Стенд «Приёмки». Один `docker compose up` поднимает базу, объектное
# хранилище, API с применёнными миграциями и веб-клиент.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-priyomka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте пароль в .env}
      POSTGRES_DB: ${POSTGRES_DB:-priyomka}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-priyomka} -d ${POSTGRES_DB:-priyomka}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-priyomka}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задайте ключ в .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?задайте строку подключения в .env}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-priyomka}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-priyomka}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?задайте ключ в .env}
      # Каталог хранилища файлов. Реализация порта FileStorage сейчас одна —
      # на файловой системе, поэтому каталогу нужен том: без него план
      # объекта исчезнет при первом пересоздании контейнера. Ключи S3 выше
      # объявлены под второй адаптер и кодом пока не читаются.
      STORAGE_DIR: /var/lib/priyomka/files
    volumes: ["api-files:/var/lib/priyomka/files"]
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  postgres-data:
  minio-data:
  api-files:

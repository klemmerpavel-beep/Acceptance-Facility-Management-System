# Стенд «Приёмки». Один `docker compose up` поднимает базу, API с
# применёнными миграциями и веб-клиент.
#
# Объектного хранилища MinIO здесь больше нет (02.10.2026, полный аудит П-55):
# образ `minio/minio` из реестра Docker Hub недоступен, и `docker compose up`
# из чистого клона падал на его загрузке, а кодом хранилище не читалось вовсе —
# файлы лежат на томе `api-files`. Хранилище S3 вводится вторым адаптером
# порта FileStorage при переезде в российское облако (план 6.1).
#
# Умолчания — промышленные (решение заказчика от 01.10.2026, полный аудит
# П-28): `NODE_ENV=production`, код входа и ссылка в ответ не попадают, порты
# базы, хранилища и API слушают только локальный адрес машины. Наружу смотрит
# один веб-клиент. Стенд для показа и проверок включает эхо кода явно —
# `AUTH_ECHO=1` в `.env` при `NODE_ENV=development`; сервер с флагом в
# промышленном режиме не запускается.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-priyomka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте пароль в .env}
      POSTGRES_DB: ${POSTGRES_DB:-priyomka}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-priyomka} -d ${POSTGRES_DB:-priyomka}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?задайте строку подключения в .env}
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_ECHO: ${AUTH_ECHO:-}
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      # Каталог хранилища файлов. Реализация порта FileStorage сейчас одна —
      # на файловой системе, поэтому каталогу нужен том: без него план
      # объекта исчезнет при первом пересоздании контейнера.
      STORAGE_DIR: /var/lib/priyomka/files
    volumes: ["api-files:/var/lib/priyomka/files"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  postgres-data:
  api-files:

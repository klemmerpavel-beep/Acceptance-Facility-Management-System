<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF0F4;
      --ink:#0E1A28; --ink-2:#46586B; --ink-3:#5E6E81; --ink-inv:#FFFFFF;
      --line:#DCE2E9; --line-strong:#B7C2CE;
      --accent:#17457A; --accent-hover:#10365F; --accent-soft:#E4EBF4; --accent-ink:#FFFFFF;
      --on-accent-fill:rgba(255,255,255,.16); --on-accent-track:rgba(255,255,255,.24);
      --signal:#9C5E17; --signal-soft:#FBEEDC;
      --ok:#2C7753; --ok-soft:#E1F0E8; --warn:#8E670C; --warn-soft:#FAF0D7;
      --danger:#B3261E; --danger-soft:#FBE4E2; --neutral-soft:#E9EDF1;
      --surface-inv:#0E1A28; --ink-on-inv:#E8EDF2; --ink-on-inv-2:#93A3B5; --line-inv:#25313F;
      --font-ui:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
      --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
      font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
    h1,h2,h3,p,dl,dd,dt,figure{margin:0}
    a{color:var(--accent);text-underline-offset:2px}
    a:hover{color:var(--accent-hover)}
    .t-h1{font-size:24px;line-height:1.2;font-weight:600}
    .t-h2{font-size:19px;line-height:1.25;font-weight:600}
    .t-h3{font-size:16px;line-height:1.3;font-weight:600}
    .t-sm{font-size:13px;line-height:1.45}
    .t-cap{font-size:11px;line-height:1.3;font-weight:500;letter-spacing:.08em;
      text-transform:uppercase;color:var(--ink-3)}
    .t-muted{color:var(--ink-3)}
    .t-secondary{color:var(--ink-2)}
    .num{font-family:var(--font-mono);font-size:15px;line-height:1.3;font-weight:500;
      font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
    .pill{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:999px;
      font-size:13px;font-weight:500;background:var(--neutral-soft);color:var(--ink-2);white-space:nowrap}
    .pill--ok{background:var(--ok-soft);color:var(--ok)}
    .pill--warn{background:var(--warn-soft);color:var(--warn)}
    .pill--danger{background:var(--danger-soft);color:var(--danger)}
    .code-badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;
      background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);
      font-size:13px;font-weight:600;letter-spacing:.02em}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;
      padding:0 16px;border:1px solid transparent;border-radius:10px;font-size:15px;
      font-weight:500;font-family:inherit;cursor:pointer}
    .btn--primary{background:var(--accent);color:var(--accent-ink)}
    .btn--secondary{background:transparent;color:var(--ink);border-color:var(--line-strong)}
    .btn--text{background:transparent;color:var(--accent);padding:0 8px}
    .segmented{display:inline-flex;padding:2px;background:var(--surface-2);border-radius:6px}
    .segmented__option{height:32px;padding:0 12px;border:0;background:transparent;border-radius:4px;
      font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
    .segmented__option[aria-pressed="true"]{background:var(--surface);color:var(--ink);
      font-weight:500;box-shadow:0 1px 2px rgba(14,26,40,.06)}
    .appbar{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;
      background:var(--accent);color:var(--accent-ink)}
    .appbar__brand{font-size:16px;font-weight:600;letter-spacing:-.01em}
    .appbar__nav{display:flex;gap:4px;margin-inline:auto}
    .appbar__link{display:inline-flex;align-items:center;height:32px;padding:0 12px;
      border-radius:999px;color:var(--accent-ink);text-decoration:none;font-size:13px;font-weight:500}
    .appbar__link[aria-current="page"]{background:var(--surface);color:var(--accent)}
    .cover{background:var(--accent);color:var(--accent-ink);padding:12px 24px 24px}
    .cover__crumbs{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.72}
    .cover__title{display:flex;align-items:center;gap:12px;margin-top:8px}
    .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
    .tabs__item{padding:12px 0;border:0;border-bottom:2px solid transparent;background:none;
      color:var(--ink-2);font-family:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
    .tabs__item[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
    .field{display:flex;flex-direction:column;gap:4px}
    .field__label{font-size:13px;color:var(--ink-2)}
    .input{height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--line);
      border-radius:6px;color:var(--ink);font-family:inherit;font-size:15px}
    .deflist__row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    .deflist__term{font-size:13px;color:var(--ink-2)}
    .deflist__value{font-size:13px;text-align:right}
    .icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;
      stroke-linecap:square;stroke-linejoin:miter}
  </style>
</helmet>
<div style="min-height:844px;display:flex;flex-direction:column;background:var(--bg)">

  <header class="appbar" style="padding:0 16px;gap:12px">
    <button aria-label="Назад" style="border:0;background:none;color:var(--accent-ink);padding:4px;cursor:pointer">
      <svg class="icon" aria-hidden="true"><path d="M12 4 6 10l6 6"/></svg>
    </button>
    <span class="code-badge" style="background:var(--on-accent-fill);color:var(--accent-ink)">R-99</span>
    <span class="t-sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Московский проспект 116</span>
  </header>

  <main style="flex:1 1 auto;padding:16px 16px 88px;display:flex;flex-direction:column;gap:16px">

    <div class="segmented" style="width:100%">
      <button class="segmented__option" aria-pressed="true" style="flex:1 1 0">Начальный</button>
      <button class="segmented__option" style="flex:1 1 0">Перепланировки</button>
    </div>

    <section class="panel" style="padding:16px;display:flex;flex-direction:column;gap:8px">
      <p class="t-cap">Общее</p>
      <div class="deflist__row"><span class="deflist__term">Помещений</span><span class="num" style="font-size:13px">7 шт</span></div>
      <div class="deflist__row"><span class="deflist__term">Площадь</span><span class="num" style="font-size:13px">80,53 м²</span></div>
      <div class="deflist__row"><span class="deflist__term">Площадь стен</span><span class="num" style="font-size:13px">218,03 м²</span></div>
      <div class="deflist__row"><span class="deflist__term">Объём</span><span class="num" style="font-size:13px">217,43 м³</span></div>
      <button class="btn btn--secondary" style="margin-top:8px;height:48px">
        <svg class="icon" aria-hidden="true"><path d="M5 3h7l3 3v11H5z"/><path d="M8 10h4M8 13h4"/></svg>
        Скачать
      </button>
    </section>

    <div class="tabs" style="gap:16px;overflow-x:auto">
      <button class="tabs__item">Коридор</button>
      <button class="tabs__item" aria-selected="true">Спальня</button>
      <button class="tabs__item">Кухня</button>
      <button class="tabs__item">Гостиная</button>
      <button class="tabs__item">Санузел</button>
    </div>

    <section style="background:var(--surface-inv);color:var(--ink-on-inv);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px">

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span class="t-h3">Вид</span>
        <div class="segmented" style="background:rgba(255,255,255,.10)">
          <button class="segmented__option" aria-pressed="true" style="background:var(--surface);color:var(--accent);font-weight:500">Обычный</button>
          <button class="segmented__option" style="color:var(--ink-on-inv-2)">Pro</button>
        </div>
      </div>

      <h3 class="t-h2">Спальня</h3>

      <svg viewBox="0 0 320 200" style="width:100%;height:auto;display:block" aria-label="План помещения">
        <path d="M14 14 H214 V44 H306 V158 H244 V186 H14 Z" fill="rgba(255,255,255,.04)" stroke="#E8EDF2" stroke-width="2"/>
        <path d="M14 78 V122" stroke="#6FA3DC" stroke-width="6"/>
        <path d="M244 158 V186" stroke="#9C5E17" stroke-width="6"/>
        <text x="96" y="112" fill="#E8EDF2" font-family="IBM Plex Mono, monospace" font-size="13">18,40 м²</text>
      </svg>

      <div>
        <p class="t-cap" style="color:var(--ink-on-inv-2);margin-bottom:8px">Основное</p>
        <dl style="display:flex;flex-direction:column;gap:6px">
          <div class="deflist__row"><dt class="deflist__term" style="color:var(--ink-on-inv-2)">Площадь</dt><dd class="num" style="font-size:13px;color:var(--ink-on-inv)">18,40 м²</dd></div>
          <div class="deflist__row"><dt class="deflist__term" style="color:var(--ink-on-inv-2)">Площадь стен</dt><dd class="num" style="font-size:13px;color:var(--ink-on-inv)">47,52 м²</dd></div>
          <div class="deflist__row"><dt class="deflist__term" style="color:var(--ink-on-inv-2)">Высота</dt><dd class="num" style="font-size:13px;color:var(--ink-on-inv)">2,70 м</dd></div>
          <div class="deflist__row"><dt class="deflist__term" style="color:var(--ink-on-inv-2)">Объём</dt><dd class="num" style="font-size:13px;color:var(--ink-on-inv)">49,68 м³</dd></div>
        </dl>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
        <div>
          <p class="t-cap" style="color:var(--ink-on-inv-2);margin-bottom:8px">Окна</p>
          <p class="num" style="font-size:13px;color:var(--ink-on-inv);text-align:left">1 шт · 2,10 м²</p>
        </div>
        <div>
          <p class="t-cap" style="color:var(--ink-on-inv-2);margin-bottom:8px">Двери</p>
          <p class="num" style="font-size:13px;color:var(--ink-on-inv);text-align:left">1 шт · 1,68 м²</p>
        </div>
      </div>
    </section>
  </main>

  <nav style="position:absolute;left:0;right:0;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:56px;background:var(--surface);border-top:1px solid var(--line)">
    <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);text-decoration:none;font-size:11px">
      <svg class="icon" aria-hidden="true"><path d="M3 3h14v14H3z"/><path d="M3 11h6V3"/></svg>Главная
    </a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--accent);text-decoration:none;font-size:11px">
      <svg class="icon" aria-hidden="true"><path d="M3 5h9M3 10h9M3 15h9"/><path d="M15 5h2M15 10h2M15 15h2"/></svg>Объекты
    </a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);text-decoration:none;font-size:11px">
      <svg class="icon" aria-hidden="true"><path d="M3 3h14v14H3z"/><path d="M6.5 10.5 9 13l4.5-4.5"/></svg>Приёмка
    </a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);text-decoration:none;font-size:11px">
      <svg class="icon" aria-hidden="true"><path d="M5 3h10v14l-2.5-1.5L10 17l-2.5-1.5L5 17z"/><path d="M8 7h4M8 10h4"/></svg>Чеки
    </a>
  </nav>
</div>
</x-dc>
</body>
</html>

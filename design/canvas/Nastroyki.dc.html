<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF0F4;
      --ink:#0E1A28; --ink-2:#3C4C5E; --ink-3:#5A6979; --ink-inv:#FFFFFF;
      --line:#DCE2E9; --line-strong:#B7C2CE;
      --accent:#4A3AB8; --accent-hover:#3B2E96; --accent-soft:#F0EEFD; --accent-ink:#FFFFFF;
      --on-accent-fill:rgba(255,255,255,.16); --on-accent-track:rgba(255,255,255,.24);
      --signal:#9C5E17; --signal-soft:#FBEEDC;
      --ok:#2C7753; --ok-soft:#E1F0E8; --warn:#8E670C; --warn-soft:#FAF0D7;
      --danger:#A5150D; --danger-soft:#FBE4E2; --neutral-soft:#E9EDF1;
      --band:#6C5CE7;--band-ink:#FFFFFF;--band-active:#FFFFFF;--band-active-ink:#4A3AB8;
      --on-band-fill:rgba(255,255,255,.16);--on-band-track:rgba(255,255,255,.24);
      --surface-inv:#0E1A28; --ink-on-inv:#E8EDF2; --ink-on-inv-2:#A8B6C4; --line-inv:#28323E; --accent-inv:#B7B0F6;
      --radius-sm:4px; --radius-chip:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
      --shadow-1:0 1px 2px rgba(14,26,40,.06); --shadow-2:0 4px 16px rgba(14,26,40,.10);
      --font-ui:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
      --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
      font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
    h1,h2,h3,p,dl,dd,dt,figure{margin:0}
    a{color:var(--accent);text-underline-offset:2px}
    a:hover{color:var(--accent-hover)}
    .t-h1{font-family:var(--font-ui);font-size:24px;line-height:1.2;font-weight:700;letter-spacing:.01em}
    .t-h2{font-family:var(--font-ui);font-size:19px;line-height:1.25;font-weight:700;letter-spacing:.01em}
    .t-h3{font-size:16px;line-height:1.3;font-weight:600}
    .t-body{font-size:15px;line-height:1.55}
    .t-sm{font-size:13px;line-height:1.45}
    .t-cap{font-family:var(--font-ui);font-size:11px;line-height:1.3;font-weight:500;letter-spacing:.08em;
      text-transform:uppercase;color:var(--ink-3)}
    .t-muted{color:var(--ink-3)}
    .t-secondary{color:var(--ink-2)}
    .num{font-family:var(--font-mono);font-size:15px;line-height:1.3;font-weight:500;
      font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    .panel{border-block:1px solid var(--line)}
    .panel--sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
    .pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-chip);
      font-size:13px;font-weight:500;background:var(--neutral-soft);color:var(--ink-2);white-space:nowrap}
    .pill--ok{background:var(--ok-soft);color:var(--ok)}
    .pill--warn{background:var(--warn-soft);color:var(--warn)}
    .pill--danger{background:var(--danger-soft);color:var(--danger)}
    .code-badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-chip);
      background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);
      font-size:13px;font-weight:600;letter-spacing:.02em}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;
      padding:0 16px;border:1px solid transparent;border-radius:var(--radius-md);font-size:15px;
      font-weight:500;font-family:inherit;cursor:pointer}
    .btn--primary{background:var(--accent);color:var(--accent-ink)}
    .btn--secondary{background:transparent;color:var(--ink);border-color:var(--line-strong)}
    .btn--text{background:transparent;color:var(--accent);padding:0 8px}
    .segmented{display:inline-flex;padding:2px;background:var(--surface-2);border-radius:var(--radius-md)}
    .segmented__option{min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:var(--radius-chip);
      font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
    .segmented__option[aria-pressed="true"]{background:var(--surface);color:var(--ink);
      font-weight:500;box-shadow:0 1px 2px rgba(14,26,40,.06)}
    .appbar{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;
      background:var(--band);color:var(--band-ink)}
    .appbar__brand{font-size:16px;font-weight:600;letter-spacing:-.01em}
    .appbar__nav{display:flex;gap:4px;margin-inline:auto}
    .appbar__link{display:inline-flex;align-items:center;height:32px;padding:0 12px;
      border-radius:var(--radius-pill);color:var(--band-ink);text-decoration:none;font-size:13px;font-weight:500}
    .appbar__link[aria-current="page"]{background:var(--band-active);color:var(--band-active-ink)}
    .cover{padding:16px 24px 12px;border-bottom:1px solid var(--line)}
    .cover__crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
    .cover__title{display:flex;align-items:center;gap:12px;margin-top:8px}
    .stamp{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
      background:var(--surface);border-block:1px solid var(--ink);margin-bottom:24px}
    .stamp__cell{display:flex;flex-direction:column;gap:2px;min-inline-size:0;
      padding:8px 12px;border-inline-start:1px solid var(--line)}
    .stamp__cell--wide{grid-column:span 2}
    .stamp__cell:first-child{border-inline-start:0}
    .stamp__value{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .stamp__value--code{font-family:var(--font-mono);font-weight:600;letter-spacing:.02em}
    .stamp__crumbs{display:flex;align-items:center;gap:8px;padding:12px 0;
      font-size:13px;color:var(--ink-3)}
    .scale{display:flex;flex-direction:column;gap:4px;min-inline-size:140px}
    .scale__track{position:relative;height:10px;border:1px solid var(--line-strong)}
    .scale__fill{position:absolute;top:0;bottom:0;left:0;background:var(--accent)}
    .scale__tick{position:absolute;top:-4px;width:1px;height:4px;background:var(--line-strong)}
    .scale__legend{display:flex;justify-content:space-between;gap:8px;
      font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
    .scale__value{font-weight:600;color:var(--ink)}
    .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
    .tabs__item{padding:12px 0;border:0;border-bottom:2px solid transparent;background:none;
      color:var(--ink-2);font-family:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
    .tabs__item[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
    .field{display:flex;flex-direction:column;gap:4px}
    .field__label{font-size:13px;color:var(--ink-2)}
    .input{height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--radius-md);color:var(--ink);font-family:inherit;font-size:15px}
    .deflist__row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    .deflist__term{font-size:13px;color:var(--ink-2)}
    .deflist__value{font-size:13px;text-align:right}
    .icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;
      stroke-linecap:square;stroke-linejoin:miter}
    .rule{border:0;border-top:1px solid var(--line);margin:0}
    .rule--inv{border-top-color:var(--line-inv)}
    .spec{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0}
    .spec--col{flex-direction:column;gap:8px}
    .spec__item{display:inline-flex;align-items:baseline;gap:6px;font-size:13px;line-height:1.45;color:var(--ink-2)}
    .spec__value{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--accent);
      font-variant-numeric:tabular-nums;white-space:nowrap}
    .spec--inv .spec__item{color:var(--ink-on-inv-2)}
    .spec--inv .spec__value{color:var(--accent-inv)}
    .toggle{display:inline-flex;align-items:center;gap:10px;padding:0;border:0;background:none;
      font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
    .toggle__track{position:relative;width:44px;height:24px;flex:none;border-radius:var(--radius-pill);
      background:var(--line-strong)}
    .toggle__knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:var(--radius-pill);
      background:var(--surface);box-shadow:var(--shadow-1)}
    .toggle__name{font-weight:500;color:var(--ink)}
    .toggle[aria-checked="true"] .toggle__track{background:var(--accent)}
    .toggle[aria-checked="true"] .toggle__knob{left:22px}
    .toggle--inv .toggle__track{background:var(--line-inv)}
    .toggle--inv .toggle__name{color:var(--ink-on-inv)}
    .toggle--inv[aria-checked="true"] .toggle__track{background:var(--accent-inv)}
    .selectwrap{position:relative;display:inline-flex;align-items:center}
    .selectwrap .input{width:100%;padding-right:32px;appearance:none;-webkit-appearance:none}
    .selectwrap__chevron{position:absolute;right:8px;color:var(--ink-3);pointer-events:none}
    .iconbtn{display:grid;place-items:center;width:32px;height:32px;flex:none;border:1px solid var(--line-strong);
      border-radius:var(--radius-md);background:var(--surface);color:var(--ink-2);cursor:pointer}
    .iconbtn--inv{border-color:var(--line-inv);background:transparent;color:var(--ink-on-inv-2)}
    .figure{display:flex;flex-direction:column;gap:4px}
    .figure+.figure{padding-top:16px;border-top:1px solid var(--line)}
    .figure__label{font-size:11px;line-height:1.3;font-weight:500;letter-spacing:.08em;
      text-transform:uppercase;color:var(--ink-3)}
    .figure__value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:32px;
      line-height:1.15;font-weight:600}
    .figure__value--h2{font-size:19px;line-height:1.25}
    .figure__note{font-size:13px;color:var(--ink-3)}
    .tile{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 16px}
    .tile--accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .tile--accent .figure__label,.tile--accent .figure__note{color:var(--accent-ink);opacity:.78}
    .tile--accent .figure__value{color:var(--accent-ink)}
    .section-head{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:space-between;
      gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line-strong)}
    .metric{display:inline-flex;flex-direction:column;gap:2px;padding:8px 12px;
      border:1px solid var(--line-strong);border-radius:var(--radius-md)}
    .metric__value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
    .metric__label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
    .mail-gateway{display:inline-flex;align-items:center;flex-wrap:wrap;font-family:var(--font-mono);font-size:13px}
    .empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:32px 16px}
    .empty__title{font-size:16px;font-weight:600}
    .empty__text{font-size:13px;color:var(--ink-3)}
    .table{width:100%;border-collapse:collapse}
    .table th{padding:8px 12px;border-bottom:1px solid var(--line-strong);font-size:11px;font-weight:500;
      letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;white-space:nowrap}
    .table td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
    .table tbody tr:nth-child(even){background:var(--surface-2)}
    .table__sort{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;
      font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
    .table th[aria-sort] .table__sort{color:var(--accent)}
  </style>
</helmet>
<main style="padding:24px;display:flex;flex-direction:column;gap:24px">

  <h2 class="t-h1">Настройки</h2>

  <div class="tabs">
    <button class="tabs__item" aria-selected="true">Обзор</button>
    <button class="tabs__item">Реквизиты</button>
    <button class="tabs__item">Права доступа</button>
    <button class="tabs__item">Уведомления</button>
    <button class="tabs__item">Смета</button>
    <button class="tabs__item">Интеграции</button>
  </div>

  <section class="panel" style="padding:24px;max-width:840px;display:flex;flex-direction:column;gap:24px">
    <h3 class="t-h2">Данные организации</h3>

    <div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:24px;align-items:start">
      <div style="width:96px;height:96px;border-radius:var(--radius-pill);background:var(--accent-soft);display:grid;place-items:center">
        <svg width="36" height="36" viewBox="0 0 20 20" fill="none" stroke="#4A3AB8" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M5.5 10.5 8.5 13.5 14.5 7"/></svg>
      </div>
      <label class="field">
        <span class="t-cap">Название <span style="color:var(--danger)">*</span></span>
        <input class="input" value="DOLGIY STUDIO">
      </label>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px">
      <label class="field">
        <span class="t-cap">Часовой пояс <span style="color:var(--danger)">*</span></span>
        <div class="selectwrap"><select class="input" aria-label="Часовой пояс"><option>(UTC+03:00) Москва</option></select><svg class="icon selectwrap__chevron" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></div>
      </label>
      <label class="field">
        <span class="t-cap">Валюта <span style="color:var(--danger)">*</span></span>
        <input class="input" value="₽" disabled style="background:var(--surface-2);color:var(--ink-3)">
      </label>
      <label class="field">
        <span class="t-cap">Телефон</span>
        <input class="input" style="font-family:var(--font-mono)" placeholder="+7 (___) ___-__-__">
      </label>
      <label class="field">
        <span class="t-cap">Почта</span>
        <input class="input" value="studio@dolgiy.studio">
      </label>
    </div>

    <hr class="rule">

    <div style="display:flex;justify-content:flex-start">
      <button class="btn btn--primary">Сохранить изменения</button>
    </div>
  </section>

  <p class="t-sm t-muted" style="max-width:76ch">Вкладка «Смета» ведёт справочник единиц измерения — он уже наполнен девятью каноническими формами. Права доступа, уведомления и интеграции показаны вкладками — их наполнение идёт следующими стадиями.</p>
</main>
</x-dc>
</body>
</html>

# Предел запросов входа с одного адреса (ADR-0008, п. 7; K7 фазы 0, П-63).
# Файл подключается образом как /etc/nginx/conf.d/default.conf — внутри блока
# http, и зона объявляется здесь, вне server. Десять запросов в минуту с
# запасом в десять подряд: вход по коду — два-три запроса, по ссылке — один,
# а залп перебора упирается в 429 до сервера. Сервер держит свои пределы на
# номер и адрес почты (`apps/api/src/auth/limits.ts`); эта ступень — по
# адресу запроса, которого сервер не видит: доверять X-Forwarded-For он не
# станет (ADR-0008, п. 7). За балансировщиком сюда добавляются
# `set_real_ip_from <адрес балансировщика>;` и `real_ip_header X-Forwarded-For;`
# — иначе все запросы придут с одного адреса балансировщика.
limit_req_zone $binary_remote_addr zone=vhod:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Клиент и API выглядят как один источник: кука сессии httpOnly
  # и SameSite=Lax, кросс-доменно браузер её не отдаст.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Обмен ссылки входа (ADR-0008, п. 1; K5 фазы 0, П-61). Переходный
  # `GET /api/auth/consume?token=…` несёт токен в строке запроса, а встроенный
  # формат журнала nginx пишет строку запроса целиком: кто читал журнал,
  # входил под чужой учётной записью. Журнал доступа этого адреса отключён;
  # журнал ошибок тоже — он пишет строку запроса в отказе предела и в сбое
  # прокси. Новая ссылка несёт токен во фрагменте адреса и в теле `POST`, и
  # строка запроса у неё пуста; отключение остаётся до снятия `GET`.
  #
  # Отказ предела уходит своим именованным местом, а не общим `@vhod_predel`:
  # после внутренней переадресации запрос пишется настройками того места, куда
  # переадресован, а `access_log off` отсюда туда не переходит. Общее место
  # журнал ведёт, и переходный `GET`, упёршийся в предел, ложился туда строкой
  # с токеном (проверка ветки 07.11.2026; ADR-0008, приписка, п. 1).
  location = /api/auth/consume {
    access_log off;
    error_log /dev/null;
    limit_req zone=vhod burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @vhod_predel_obmen;
    proxy_pass http://api:3000/auth/consume;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # «Кто я» спрашивает каждая загрузка приложения: это проверка сессии, а не
  # вход, и предел здесь отказывал бы конторе за одним адресом в продукте.
  location = /api/auth/me {
    proxy_pass http://api:3000/auth/me;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Запрос ссылки и кода, подтверждение кода, выход — под пределом.
  location /api/auth/ {
    limit_req zone=vhod burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @vhod_predel;
    proxy_pass http://api:3000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Отказ предела — тем же видом, что отказы сервера: экран входа показывает
  # поле `message`, а страница nginx по умолчанию дала бы «код 429» без слов.
  location @vhod_predel {
    default_type application/json;
    return 429 '{"statusCode":429,"message":"Слишком много запросов. Повторите через минуту."}';
  }

  # Тот же отказ для обмена ссылки — без журналов: строка запроса переходного
  # `GET` несёт токен, и отказ предела её писать не должен.
  location @vhod_predel_obmen {
    access_log off;
    error_log /dev/null;
    default_type application/json;
    return 429 '{"statusCode":429,"message":"Слишком много запросов. Повторите через минуту."}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
